name: agentic

on: workflow_dispatch

jobs:
  tests_run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests and safety check
        run: |
          python -m pip install --upgrade pip
          pip install tox
          tox -e py311
          tox -e safety
